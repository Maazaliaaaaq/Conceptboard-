<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Conceptboard Collab - Real-Time Whiteboard</title>
    <meta name="description" content="Real-time collaborative online whiteboard with Firebase sync, drawing tools, sticky notes, and live presence." />
    <meta property="og:title" content="Conceptboard Collab - Real-Time Whiteboard" />
    <meta property="og:description" content="Real-time collaborative online whiteboard with Firebase sync, drawing tools, sticky notes, and live presence." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      if (window.pdfjsLib) {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      }
      window.addEventListener('error', function(e) {
        console.error('Global error caught:', e.message);
      });
      setTimeout(function() {
        var root = document.getElementById('root');
        if (root && root.innerHTML.trim() === '') {
          root.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#f8fafc;font-family:system-ui,sans-serif;padding:24px;text-align:center;">' +
            '<div style="max-width:400px;background:#1e293b;padding:32px;border-radius:16px;border:1px solid #334155;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);">' +
            '<h2 style="font-size:20px;font-weight:bold;margin-bottom:8px;">Ready to Load</h2>' +
            '<p style="font-size:14px;color:#94a3b8;margin-bottom:24px;">Click below to launch your collaborative whiteboard session.</p>' +
            '<button onclick="localStorage.clear();window.location.reload();" style="background:#4f46e5;color:white;border:none;padding:12px 24px;font-weight:600;border-radius:12px;cursor:pointer;font-size:14px;box-shadow:0 4px 6px -1px rgba(0,0,0,0.1);">Launch Whiteboard</button>' +
            '</div></div>';
        }
      }, 3000);
    </script>
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased overflow-hidden select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
